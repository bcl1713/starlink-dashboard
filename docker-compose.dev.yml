services:
  starlink-location:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${STARLINK_DEV_BACKEND_PORT:-18000}:8000"
    volumes:
      - ./backend/starlink-location:/app
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
