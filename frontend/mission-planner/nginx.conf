server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    error_page 413 = @mission_package_too_large;

    location @mission_package_too_large {
        default_type application/json;
        return 413 '{"detail":{"code":"mission_package_too_large","layer":"mission-planner-nginx","max_bytes":104857600}}';
    }

    location @mission_archive_too_large {
        default_type application/json;
        return 413 '{"detail":{"code":"mission_package_too_large","layer":"mission-planner-nginx","max_bytes":2147483648}}';
    }

    # Keep mission-package uploads on the same origin and permit the documented
    # 2 GiB ZIP limit plus 1 MiB of multipart framing. The exact location avoids changing other API routes.
    location = /api/v2/missions/import {
        client_max_body_size 2049m;
        error_page 413 = @mission_archive_too_large;
        proxy_pass http://starlink-location:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Only these static, script-free documents may be embedded by local Help.
    # Keep the application and all other routes protected by frame-ancestors none.
    location ~ ^/operator-help/(guide|quick-reference)\.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; form-action 'none'; base-uri 'none';" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), fullscreen=(self), payment=()" always;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service methods use origin-relative `/api/...` paths. Keep API traffic on
    # the Mission Planner hostname and forward it to the backend container.
    # Prevent the static PNG regex from swallowing buffered weather API tiles.
    location ^~ /api/overview-weather/ {
        proxy_pass http://starlink-location:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A cold export waits for the shared background page queue (bounded at 600s).
    # Ready exports only assemble PDFs; keep the extra wait scoped to exports.
    location ~ ^/api/v2/missions/[^/]+/export$ {
        proxy_pass http://starlink-location:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
    }

    location /api/ {
        proxy_pass http://starlink-location:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; media-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), fullscreen=(self), payment=()" always;
}
