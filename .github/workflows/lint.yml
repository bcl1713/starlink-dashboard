name: Code Quality (Linting & Formatting)

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  static:
    name: Static Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install backend development dependencies
        run: python -m pip install -r backend/starlink-location/requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/mission-planner/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend/mission-planner
        run: npm ci --legacy-peer-deps
      - name: Install Markdownlint
        run: npm install --global markdownlint-cli2
      - name: Install Lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee@0.20.1
      - name: Run static quality gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
            policy_base_sha="$(git merge-base HEAD "origin/$PR_BASE_REF")"
          else
            policy_base_sha="$PUSH_BASE_SHA"
          fi
          git cat-file -e "${policy_base_sha}^{commit}"
          git merge-base --is-ancestor "$policy_base_sha" HEAD
          ACCEPTANCE_POLICY_BASE_SHA="$policy_base_sha" ./tools/verify static

  backend:
    name: Backend Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install backend dependencies
        run: python -m pip install -r backend/starlink-location/requirements-dev.txt
      - name: Run backend test gate
        run: ./tools/verify backend

  frontend:
    name: Frontend Test and Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/mission-planner/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend/mission-planner
        run: npm ci --legacy-peer-deps
      - name: Run frontend test and build gate
        run: ./tools/verify frontend
