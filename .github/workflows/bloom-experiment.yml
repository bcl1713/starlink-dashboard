name: Offline bloom review evidence

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/bloom-experiment.yml"
      - "frontend/mission-planner/**"
      - "docs/development/overview-bloom-experiment.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bloom:
    if:
      ${{ github.head_ref == 'experiment/overview-real-bloom' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name ==
      'experiment/overview-real-bloom') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/mission-planner/package-lock.json
      - name: Record candidate
        id: candidate
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies and browser
        working-directory: frontend/mission-planner
        run: |
          timeout --kill-after=10s 5m npm ci
          timeout --kill-after=10s 5m npx playwright install --with-deps chromium
      - name: Build and package exact source
        working-directory: frontend/mission-planner
        run: |
          timeout --kill-after=10s 2m node --test scripts/bloom*.test.mjs
          timeout --kill-after=10s 5m npm run build:bloom
          timeout --kill-after=10s 2m npm run package:bloom
      - name: Cold-test copied package and picking
        id: smoke
        env:
          BLOOM_PACKAGE_DIR:
            ${{ github.workspace }}/frontend/mission-planner/bloom-offline/${{
            steps.candidate.outputs.sha }}
          BLOOM_REQUIRE_CLEAN: "1"
        run:
          timeout --kill-after=10s 8m node
          frontend/mission-planner/scripts/bloom-smoke.mjs
      - name: Verify owned runtime teardown
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        run:
          timeout --kill-after=10s 1m node
          frontend/mission-planner/scripts/bloom-verify-cleanup.mjs
      - name: Assemble review ZIP
        run:
          timeout --kill-after=10s 2m node
          frontend/mission-planner/scripts/bloom-review-bundle.mjs
      - name: Upload exact-SHA package and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: overview-bloom-${{ steps.candidate.outputs.sha }}
          path: |
            .bloom-work/overview-bloom-${{ steps.candidate.outputs.sha }}.zip
            .bloom-work/overview-bloom-${{ steps.candidate.outputs.sha }}.zip.sha256
            frontend/mission-planner/test-results/bloom/${{ steps.candidate.outputs.sha }}/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
