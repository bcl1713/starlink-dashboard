# Paste or mount this server-context snippet into the Mission Planner Proxy Host.
# It is deliberately kept in source control so the edge proxy has the same
# 100 MiB mission-package limit as the application and frontend Nginx.
client_max_body_size 100m;

error_page 413 = @mission_package_too_large;

location @mission_package_too_large {
    default_type application/json;
    return 413 '{"detail":{"code":"mission_package_too_large","layer":"nginx-proxy-manager","max_bytes":104857600}}';
}
