# Forge dev profile for the Git-backed Portainer deployment.
#
# This profile intentionally does not attach to the TrueNAS-hosted `proxy`
# Docker network. Docker networks do not span hosts; Nginx Proxy Manager
# reaches Forge through the host-bound ports below.
services:
  starlink-location:
    image: ghcr.io/bcl1713/starlink-dashboard/starlink-location:${STARLINK_IMAGE_TAG:?Set an immutable GHCR image tag}
    ports:
      - "${STARLINK_BIND_IP:?Set the Forge host IP}:18000:8000"
    restart: "no"
    environment:
      STARLINK_MODE: ${STARLINK_MODE:-simulation}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      STARLINK_DISH_HOST: ${STARLINK_DISH_HOST:-192.168.100.1}
      STARLINK_DISH_PORT: ${STARLINK_DISH_PORT:-9200}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - type: bind
        source: ${STARLINK_APP_DATA_PATH:?Set the persistent application data host path}
        target: /app/data
      - type: bind
        source: ${STARLINK_ROUTE_DATA_PATH:?Set the persistent route data host path}
        target: /data
    networks:
      starlink-net: {}

  prometheus:
    image: ghcr.io/bcl1713/starlink-dashboard/prometheus:${STARLINK_IMAGE_TAG:?Set an immutable GHCR image tag}
    ports:
      - "${STARLINK_BIND_IP:?Set the Forge host IP}:19090:9090"
    restart: "no"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-1y}
    volumes:
      - type: bind
        source: ${STARLINK_PROMETHEUS_DATA_PATH:?Set the persistent Prometheus data host path}
        target: /prometheus
    depends_on:
      starlink-location:
        condition: service_healthy
    networks:
      starlink-net: {}

  mission-planner:
    image: ghcr.io/bcl1713/starlink-dashboard/mission-planner:${STARLINK_IMAGE_TAG:?Set an immutable GHCR image tag}
    ports:
      - "${STARLINK_BIND_IP:?Set the Forge host IP}:18080:80"
    restart: "no"
    depends_on:
      starlink-location:
        condition: service_healthy
    networks:
      starlink-net: {}

networks:
  starlink-net:
    driver: bridge
