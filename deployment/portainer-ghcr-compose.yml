# Portainer Git-stack profile. Supply required image and host-path values in
# Portainer; this profile intentionally does not load a repository .env file.
services:
  starlink-location:
    image: ghcr.io/bcl1713/starlink-dashboard/starlink-location:${STARLINK_IMAGE_TAG:?Set an immutable GHCR image tag}
    # Deliberately on-demand: start the Portainer stack when needed.
    restart: "no"
    init: true
    environment:
      STARLINK_EXPORTS_CUSTOMER_BRIEFING_ENABLED: ${STARLINK_EXPORTS_CUSTOMER_BRIEFING_ENABLED:-false}
      STARLINK_MODE: ${STARLINK_MODE:-simulation}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      STARLINK_DISH_HOST: ${STARLINK_DISH_HOST:-192.168.100.1}
      STARLINK_DISH_PORT: ${STARLINK_DISH_PORT:-9200}
      GFS_MAILBOX_PATH: /app/data/gfs-mailbox
      GFS_ARTIFACT_PATH: /app/data/gfs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - type: bind
        source: ${STARLINK_APP_DATA_PATH:?Set the persistent application data host path}
        target: /app/data
      - type: bind
        source: ${STARLINK_ROUTE_DATA_PATH:?Set the persistent route data host path}
        target: /data
      - type: volume
        source: gfs_products
        target: /app/data/gfs
        read_only: true
      - type: volume
        source: gfs_mailbox
        target: /app/data/gfs-mailbox
    networks:
      starlink-net: {}
      proxy:
        aliases:
          - starlink-location

  # Private scientific worker; idle while model weather is disabled.
  gfs-worker:
    image: ghcr.io/bcl1713/starlink-dashboard/gfs-worker:${STARLINK_IMAGE_TAG:?Set an immutable GHCR image tag}
    restart: "no"
    user: "1000:1000"
    cpus: 1.0
    mem_limit: 1g
    init: true
    stop_grace_period: 15s
    environment:
      GFS_MAILBOX_PATH: /app/data/gfs-mailbox
      GFS_ARTIFACT_PATH: /app/data/gfs
      AVIATION_SETTINGS_PATH: /app/data/settings/aviation-weather.json
    volumes:
      - type: volume
        source: gfs_products
        target: /app/data/gfs
      - type: volume
        source: gfs_mailbox
        target: /app/data/gfs-mailbox
      - type: bind
        source: ${STARLINK_APP_DATA_PATH:?Set the persistent application data host path}/settings
        target: /app/data/settings
        read_only: true
    networks:
      starlink-net: {}

  prometheus:
    image: ghcr.io/bcl1713/starlink-dashboard/prometheus:${STARLINK_IMAGE_TAG:?Set an immutable GHCR image tag}
    # Deliberately on-demand: start the Portainer stack when needed.
    restart: "no"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-1y}
    volumes:
      - type: bind
        source: ${STARLINK_PROMETHEUS_DATA_PATH:?Set the persistent Prometheus data host path}
        target: /prometheus
    depends_on:
      starlink-location:
        condition: service_healthy
    networks:
      starlink-net: {}
      proxy:
        aliases:
          - prometheus

  mission-planner:
    image: ghcr.io/bcl1713/starlink-dashboard/mission-planner:${STARLINK_IMAGE_TAG:?Set an immutable GHCR image tag}
    # Deliberately on-demand: start the Portainer stack when needed.
    restart: "no"
    depends_on:
      starlink-location:
        condition: service_healthy
    networks:
      starlink-net: {}
      proxy:
        aliases:
          - mission-planner

networks:
  starlink-net:
    driver: bridge
  proxy:
    external: true
    name: ${STARLINK_PROXY_NETWORK:-proxy}

volumes:
  gfs_products:
  gfs_mailbox:
