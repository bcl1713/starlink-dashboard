services:
  starlink-location:
    image:
      ${BRIEFING_PROJECT}-backend:${ACCEPTANCE_CANDIDATE_SHA:?full SHA required}
    build:
      context: ${BRIEFING_SOURCE}
      dockerfile: backend/starlink-location/Dockerfile
      args:
        ACCEPTANCE_CANDIDATE_SHA: ${ACCEPTANCE_CANDIDATE_SHA}
    command: [uvicorn, backend_probe:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      PYTHONPATH: /acceptance:/app
      STARLINK_MODE: simulation
      SIMULATION_MODE: "true"
      STARLINK_CUSTOMER_BRIEFING_TRIAL_ENABLED:
        ${BRIEFING_ENABLED:?explicit flag required}
      BRIEFING_FAULT: ${BRIEFING_FAULT:-none}
      STARLINK_ROUTE_LATITUDE_START: "35.0"
      STARLINK_ROUTE_LONGITUDE_START: "-100.0"
      STARLINK_GROUND_ENTRY_LATITUDE: "36.0"
      STARLINK_GROUND_ENTRY_LONGITUDE: "-102.0"
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ${BRIEFING_SOURCE}/tools/acceptance/customer-briefing:/acceptance:ro
      - probe:/probe
      - missions:/app/data/missions
      - settings:/app/data/settings
      - satellites:/app/data/satellites
      - coverage:/app/data/sat_coverage
      - routes:/data/routes
      - simulation-routes:/data/sim_routes
      - pois:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 30s
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ${BRIEFING_SOURCE}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${BRIEFING_SOURCE}/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - metrics:/prometheus
    command:
      [
        --config.file=/etc/prometheus/prometheus.yml,
        --storage.tsdb.retention.time=1h,
      ]
  mission-planner:
    image:
      ${BRIEFING_PROJECT}-frontend:${ACCEPTANCE_CANDIDATE_SHA:?full SHA
      required}
    build:
      context: ${BRIEFING_SOURCE}/frontend/mission-planner
      args:
        ACCEPTANCE_CANDIDATE_SHA: ${ACCEPTANCE_CANDIDATE_SHA}
    ports: ["127.0.0.1:${BRIEFING_PORT:-15309}:80"]
    depends_on:
      starlink-location:
        condition: service_healthy
volumes:
  probe:
  missions:
  settings:
  satellites:
  coverage:
  routes:
  simulation-routes:
  pois:
  metrics:
