services:
  starlink-location:
    image:
      ${WEATHER_ACCEPTANCE_PROJECT:-starlink-144-weather}-backend:${ACCEPTANCE_CANDIDATE_SHA:?exact
      candidate SHA required}
    build:
      context: ${WEATHER_ACCEPTANCE_SOURCE_ROOT:-../../..}/backend/starlink-location
      args:
        ACCEPTANCE_CANDIDATE_SHA: ${ACCEPTANCE_CANDIDATE_SHA}
    command: [uvicorn, backend_fixture:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      PYTHONPATH: /acceptance:/app
      WEATHER_ACCEPTANCE_CONTROL_PATH: /control/control.json
      WEATHER_ACCEPTANCE_MODE: ${WEATHER_ACCEPTANCE_MODE:-production}
      STARLINK_MODE: simulation
      SIMULATION_MODE: "true"
      STARLINK_ROUTE_LATITUDE_START: "35.0"
      STARLINK_ROUTE_LONGITUDE_START: "-100.0"
      STARLINK_GROUND_ENTRY_LATITUDE: "36.0"
      STARLINK_GROUND_ENTRY_LONGITUDE: "-102.0"
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "127.0.0.1:${WEATHER_ACCEPTANCE_BACKEND_PORT:-18278}:8000"
    volumes:
      - ${WEATHER_ACCEPTANCE_SOURCE_ROOT}/tools/acceptance/overview-weather:/acceptance:ro
      - ${WEATHER_ACCEPTANCE_CONTROL_DIR:?control directory required}:/control
      - ${WEATHER_ACCEPTANCE_CAPTURE_DIR:?capture or fixture directory
        required}:/capture:ro
      - missions:/app/data/missions
      - settings:/app/data/settings
      - satellites:/app/data/satellites
      - coverage:/app/data/sat_coverage
      - routes:/data/routes
      - simulation-routes:/data/sim_routes
      - pois:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 30s
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ${WEATHER_ACCEPTANCE_SOURCE_ROOT:-../../..}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${WEATHER_ACCEPTANCE_SOURCE_ROOT:-../../..}/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - metrics:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    depends_on:
      starlink-location:
        condition: service_healthy
  mission-planner:
    image:
      ${WEATHER_ACCEPTANCE_PROJECT:-starlink-144-weather}-frontend:${ACCEPTANCE_CANDIDATE_SHA:?exact
      candidate SHA required}
    build:
      context: ${WEATHER_ACCEPTANCE_SOURCE_ROOT:-../../..}/frontend/mission-planner
      args:
        ACCEPTANCE_CANDIDATE_SHA: ${ACCEPTANCE_CANDIDATE_SHA}
    ports:
      - "127.0.0.1:${WEATHER_ACCEPTANCE_FRONTEND_PORT:-15278}:80"
    depends_on:
      starlink-location:
        condition: service_healthy
volumes:
  missions:
  settings:
  satellites:
  coverage:
  routes:
  simulation-routes:
  pois:
  metrics:
