services:
  starlink-location:
    build: ./backend/starlink-location/
    container_name: starlink-location
    environment:
      STARLINK_MODE: simulation
      SIMULATION_MODE: "true"
      STARLINK_DISH_HOST: 192.168.100.1
      STARLINK_DISH_PORT: "9200"
      PROMETHEUS_RETENTION: 1y
      GRAFANA_ADMIN_PASSWORD: simulation-only-local
      STARLINK_LOCATION_PORT: "8000"
      PROMETHEUS_PORT: "9090"
      GRAFANA_PORT: "3000"
      TIMEZONE_TAKEOFF: America/Los_Angeles
      TIMEZONE_LANDING: Europe/London
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "dish.starlink:192.168.100.1"
    volumes:
      - ./data/missions:/app/data/missions
      - ./data/satellites:/app/data/satellites
      - ./data/sat_coverage:/app/data/sat_coverage
      - route_data:/data/routes
      - sim_route_data:/data/sim_routes
      - poi_data:/data
    networks:
      - starlink-net
      - proxy

  prometheus:
    build: ./monitoring/prometheus
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1y"
    depends_on:
      starlink-location:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    networks:
      - starlink-net
      - proxy

  grafana:
    build: ./monitoring/grafana
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: simulation-only-local
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL: grafana-clock-panel,yesoreyeram-infinity-datasource@3.11.1
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    depends_on:
      - prometheus
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - starlink-net
      - proxy

  mission-planner:
    build:
      context: ./frontend/mission-planner
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: mission-planner
    depends_on:
      starlink-location:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - starlink-net
      - proxy

networks:
  starlink-net:
    driver: bridge
  proxy:
    external: true

volumes:
  route_data:
  sim_route_data:
  poi_data:
  prometheus_data:
  grafana_data:
