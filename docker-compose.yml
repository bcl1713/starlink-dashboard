services:
  starlink-location:
    build:
      context: .
      dockerfile: backend/starlink-location/Dockerfile
      args:
        ACCEPTANCE_CANDIDATE_SHA: ${ACCEPTANCE_CANDIDATE_SHA:-}
    container_name: starlink-location
    init: true
    env_file: .env
    environment:
      GFS_MAILBOX_PATH: /app/data/gfs-mailbox
      GFS_ARTIFACT_PATH: /app/data/gfs
    ports:
      - "${STARLINK_LOCATION_PORT}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    # Network configuration for Starlink dish access
    # For live mode, the container needs to reach the Starlink dish at 192.168.100.1:9200
    #
    # Option 1: host network mode (Linux only, best performance)
    # Uncomment 'network_mode: host' and comment out 'networks' section below
    # This allows container to access the host network directly
    # network_mode: host
    #
    # Option 2: Bridge network with extra_hosts (cross-platform, Docker Desktop compatible)
    # Uses extra_hosts to add the dish IP, allowing container to reach 192.168.100.1
    # This is the default and works on Windows, Mac, and Linux
    extra_hosts:
      - "dish.starlink:${STARLINK_DISH_HOST:-192.168.100.1}"
    volumes:
      - ./data/missions:/app/data/missions
      - ./data/satellites:/app/data/satellites
      - ./data/sat_coverage:/app/data/sat_coverage
      - ./data/settings:/app/data/settings
      - ./data/orbital:/app/data/orbital
      - gfs_products:/app/data/gfs:ro
      - gfs_mailbox:/app/data/gfs-mailbox
      - route_data:/data/routes
      - sim_route_data:/data/sim_routes
      - poi_data:/data
    networks:
      - starlink-net

  # Always available to enabled weather layers; idle without catalog demand.
  gfs-worker:
    build:
      context: ./backend/starlink-location
      dockerfile: Dockerfile.gfs
      args:
        ACCEPTANCE_CANDIDATE_SHA: ${ACCEPTANCE_CANDIDATE_SHA:-}
    user: "1000:1000"
    cpus: 1.0
    mem_limit: 1g
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    environment:
      GFS_MAILBOX_PATH: /app/data/gfs-mailbox
      GFS_ARTIFACT_PATH: /app/data/gfs
      AVIATION_SETTINGS_PATH: /app/data/settings/aviation-weather.json
    volumes:
      - gfs_products:/app/data/gfs
      - gfs_mailbox:/app/data/gfs-mailbox
      - ./data/settings:/app/data/settings:ro
    networks:
      - starlink-net

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    env_file: .env
    ports:
      - "${PROMETHEUS_PORT}:9090"
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
    depends_on:
      starlink-location:
        condition: service_healthy
    networks:
      - starlink-net

  mission-planner:
    build:
      context: ./frontend/mission-planner
      dockerfile: Dockerfile
      args:
        ACCEPTANCE_CANDIDATE_SHA: ${ACCEPTANCE_CANDIDATE_SHA:-}
        VITE_OVERVIEW_HISTORY_POLL_SECONDS: ${VITE_OVERVIEW_HISTORY_POLL_SECONDS-1}
    container_name: mission-planner
    ports:
      - "5173:80"
    depends_on:
      - starlink-location
    networks:
      - starlink-net

networks:
  starlink-net:
    driver: bridge

volumes:
  prometheus_data:
  route_data:
  sim_route_data:
  poi_data:
  gfs_products:
  gfs_mailbox:
